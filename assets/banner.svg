<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #a5b4fc;
    }

    /* CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }

    @keyframes rotateShield {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }

    .animated-bg-circle {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .particle {
      animation: floatParticle 8s ease-in-out infinite;
      transform-origin: center;
    }

    .wave-line {
      stroke-dasharray: 20, 10;
      animation: waveMove 30s linear infinite;
    }
  </style>

  <!-- Base Rect -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Dynamic Animated Ambient Glowing Circles (Background) -->
  <circle cx="150" cy="100" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)" class="animated-bg-circle" />
  <circle cx="1050" cy="300" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)" class="animated-bg-circle" style="animation-delay: -3s;" />
  <circle cx="600" cy="380" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="animated-bg-circle" style="animation-delay: -1.5s;" />

  <!-- Animated Particles in Background -->
  <circle cx="200" cy="280" r="4" fill="#818cf8" class="particle" style="animation-delay: 0s;" />
  <circle cx="350" cy="80" r="6" fill="#c084fc" class="particle" style="animation-delay: -2s;" />
  <circle cx="900" cy="120" r="5" fill="#f472b6" class="particle" style="animation-delay: -4s;" />
  <circle cx="1000" cy="240" r="3" fill="#60a5fa" class="particle" style="animation-delay: -1s;" />

  <!-- Decorative Wave Lines (Behind Text) -->
  <path d="M 0,200 Q 300,100 600,200 T 1200,200" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="wave-line" />
  <path d="M 0,230 Q 300,330 600,230 T 1200,230" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.2" class="wave-line" style="animation-direction: reverse;" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- Main Content Layout (Foreground Guaranteed) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="320" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(165, 180, 252, 0.4)" stroke-width="1" />
      <text x="16" y="21" class="badge-text">🛡️ ENDPOINT PRIVILEGE MANAGEMENT</text>
    </g>

    <!-- Title Header -->
    <text x="0" y="155" class="title">
      Awesome Local Administrator
    </text>
    <text x="0" y="205" class="title" fill="url(#accentGrad)">
      Password Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" class="subtitle">
      Curated List of SaaS Platforms &amp; Open-Source Tools for LAPS &amp; Just-In-Time Elevation
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 305)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="22" font-family="system-ui" font-size="14" font-weight="500" fill="#e2e8f0">🔄 Password Rotation</text>
      
      <!-- Tag 2 -->
      <rect x="165" y="0" width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="179" y="22" font-family="system-ui" font-size="14" font-weight="500" fill="#e2e8f0">⚡ JIT Elevation</text>

      <!-- Tag 3 -->
      <rect x="320" y="0" width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="334" y="22" font-family="system-ui" font-size="14" font-weight="500" fill="#e2e8f0">💻 Windows / macOS</text>

      <!-- Tag 4 -->
      <rect x="505" y="0" width="165" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="519" y="22" font-family="system-ui" font-size="14" font-weight="500" fill="#e2e8f0">🔑 PAM &amp; Vaulting</text>
    </g>
  </g>

  <!-- Right Decorative Security Shield Graphic -->
  <g transform="translate(1000, 200)">
    <!-- Glowing Halo -->
    <circle cx="0" cy="0" r="70" fill="url(#accentGrad)" opacity="0.3" filter="url(#shieldGlow)" />
    
    <!-- Outer Shield Frame -->
    <path d="M 0,-60 L 50,-35 V 10 C 50,45 0,65 0,65 C 0,65 -50,45 -50,10 V -35 Z" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Lock Icon inside Shield -->
    <rect x="-14" y="-5" width="28" height="26" rx="4" fill="#a855f7" />
    <path d="M -9,-5 V -15 C -9,-22 9,-22 9,-15 V -5" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="6" r="3" fill="#ffffff" />
  </g>
</svg>
